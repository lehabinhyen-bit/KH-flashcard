<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khải Huyền — Flashcard</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee;
  --surface: #ffffff;
  --border: #e2ddd6;
  --border-strong: #c8c0b4;
  --text: #1c1917;
  --text-2: #57534e;
  --text-3: #a8a29e;
  --accent: #2d4a3e;
  --accent-light: #e8f0eb;
  --gold: #92700a;
  --gold-light: #fdf4dc;
  --rose: #7f1d35;
  --rose-light: #fce8ed;
  --tab-active-bg: #2d4a3e;
  --tab-active-text: #ffffff;
  --face1: #f0ece4;
  --face2: #e8f0eb;
  --face3: #fdf4dc;
  --shadow: 0 2px 20px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.logo {
  font-family: 'Lora', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  padding: 16px 0;
  white-space: nowrap;
  letter-spacing: .02em;
}
.logo span { color: var(--text-3); font-weight: 400; }

/* ── TABS ── */
.tabs {
  display: flex;
  align-items: stretch;
  gap: 2px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  height: 56px;
  border: none;
  background: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  position: relative;
}
.tab:hover { color: var(--text); background: var(--bg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-count {
  font-size: 11px;
  background: var(--border);
  border-radius: 10px;
  padding: 1px 6px;
  color: var(--text-3);
  font-weight: 400;
}
.tab.active .tab-count { background: var(--accent-light); color: var(--accent); }

.tab-edit-btn {
  font-size: 11px;
  opacity: 0;
  padding: 2px 5px;
  border-radius: 4px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text-3);
  transition: opacity .15s;
}
.tab:hover .tab-edit-btn { opacity: 1; }
.tab-edit-btn:hover { background: var(--border); color: var(--text); }

.tab-add {
  padding: 0 14px;
  height: 56px;
  border: none;
  background: none;
  font-size: 20px;
  color: var(--text-3);
  cursor: pointer;
  transition: color .15s;
  flex-shrink: 0;
}
.tab-add:hover { color: var(--accent); }

.hdr-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  letter-spacing: .01em;
}
.hdr-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── MAIN LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 24px;
}

/* ── CARD STUDY ── */
.study-area { display: flex; flex-direction: column; gap: 20px; }

.progress-row { display: flex; align-items: center; gap: 12px; }
.progress-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.progress-label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.progress-done { font-size: 12px; color: var(--accent); font-weight: 600; }

/* Card flip */
.card-wrap {
  perspective: 1400px;
  cursor: pointer;
  position: relative;
}
.card {
  position: relative;
  width: 100%;
  height: 380px;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}
.card.face2 { transform: rotateY(120deg); }
.card.face3 { transform: rotateY(240deg); }

.face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  padding: 36px 40px;
  display: flex;
  flex-direction: column;
}
.face-1 { background: var(--surface); transform: rotateY(0deg); }
.face-2 { background: var(--surface); transform: rotateY(-120deg); }
.face-3 { background: var(--surface); transform: rotateY(-240deg); }

.face-indicator {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}
.fi-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: background .2s;
}
.fi-dot.f1 { background: var(--accent); }
.fi-dot.f2 { background: var(--gold); }
.fi-dot.f3 { background: var(--rose); }

.face-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.face-1 .face-label { color: var(--accent); }
.face-2 .face-label { color: var(--gold); }
.face-3 .face-label { color: var(--rose); }

.card-ref {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 10px;
  font-weight: 500;
}

.card-title {
  font-family: 'Lora', serif;
  font-size: 22px;
  line-height: 1.45;
  color: var(--text);
  flex: 1;
  display: flex;
  align-items: center;
}

.card-verse {
  font-family: 'Lora', serif;
  font-size: 16px;
  line-height: 1.9;
  color: var(--text);
  font-style: italic;
  flex: 1;
  overflow-y: auto;
}
.card-verse.empty {
  font-family: 'DM Sans', sans-serif;
  font-style: normal;
  color: var(--text-3);
  font-size: 14px;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.card-verse.empty:hover { color: var(--accent); }

.card-analysis {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text-2);
  flex: 1;
  overflow-y: auto;
}
.card-analysis.empty {
  color: var(--text-3);
  display: flex;
  align-items: center;
  cursor: pointer;
  font-size: 14px;
}
.card-analysis.empty:hover { color: var(--rose); }

.card-hint {
  font-size: 11px;
  color: var(--text-3);
  text-align: right;
  margin-top: 12px;
}

/* Nav */
.nav-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn { 
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 20px;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  transition: all .15s;
}
.btn:hover { background: var(--bg); border-color: var(--border-strong); color: var(--text); }
.btn:disabled { opacity: .3; cursor: default; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  padding: 9px 28px;
}
.btn-primary:hover { background: #1e3329; border-color: #1e3329; color: #fff; }

/* Status */
.status-row { display: flex; gap: 8px; justify-content: center; }
.btn-status {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: all .15s;
  color: var(--text-2);
}
.btn-status.g { border-color: #86efac; }
.btn-status.g:hover, .btn-status.g.on { background: #dcfce7; border-color: #22c55e; color: #15803d; }
.btn-status.r { border-color: #fcd34d; }
.btn-status.r:hover, .btn-status.r.on { background: #fef9c3; border-color: #eab308; color: #713f12; }
.btn-status.h { border-color: #fca5a5; }
.btn-status.h:hover, .btn-status.h.on { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

/* ── SIDEBAR ── */
.sidebar { display: flex; flex-direction: column; gap: 16px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.panel-header {
  padding: 14px 18px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-header button {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  color: var(--text-3);
  font-family: 'DM Sans', sans-serif;
  text-transform: none;
  letter-spacing: 0;
  font-weight: 500;
  transition: all .15s;
}
.panel-header button:hover { background: var(--bg); color: var(--accent); border-color: var(--accent); }

.card-list { max-height: 420px; overflow-y: auto; }
.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--bg); }
.list-item.active { background: var(--accent-light); }
.list-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.list-dot.g { background: #22c55e; }
.list-dot.r { background: #eab308; }
.list-dot.h { background: #ef4444; }
.list-ref { font-size: 11px; font-weight: 600; color: var(--accent); min-width: 55px; }
.list-title { font-size: 12px; color: var(--text-2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-btn {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  color: var(--text-3);
  font-family: 'DM Sans', sans-serif;
  opacity: 0;
  transition: all .12s;
}
.list-item:hover .list-btn { opacity: 1; }
.list-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }

.btn-add-card {
  width: 100%;
  padding: 12px;
  border: none;
  background: none;
  font-size: 13px;
  color: var(--text-3);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-top: 1px solid var(--border);
}
.btn-add-card:hover { background: var(--bg); color: var(--accent); }

/* ── FORMAT TOOLBAR ── */
.fmt-toolbar {
  display: flex;
  gap: 3px;
  margin-bottom: 5px;
}
.fmt-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 700;
  width: 28px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
  flex-shrink: 0;
}
.fmt-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.fmt-btn.fmt-i { font-style: italic; }
.fmt-btn.fmt-u { text-decoration: underline; }
.fmt-sep { width: 1px; height: 20px; background: var(--border); margin: 3px 2px; }

.clr-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .12s, border-color .12s;
  padding: 0;
}
.clr-dot:hover { transform: scale(1.25); border-color: var(--text) !important; }

/* ── EDIT PANEL ── */
.edit-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}
.edit-panel h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  display: block;
  margin-bottom: 5px;
}
.field input, .field textarea {
  width: 100%;
  font-size: 13px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.6;
  transition: border .15s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); background: var(--surface); }
.field textarea { min-height: 90px; }
.field textarea.verse { font-family: 'Lora', serif; font-style: italic; min-height: 110px; }

.rich-editor {
  width: 100%;
  min-height: 90px;
  font-size: 13px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  outline: none;
  line-height: 1.7;
  transition: border .15s;
  white-space: pre-wrap;
  word-break: break-word;
}
.rich-editor.verse {
  font-family: 'Lora', serif;
  font-style: italic;
  min-height: 110px;
}
.rich-editor:focus { border-color: var(--accent); background: var(--surface); }
.rich-editor:empty:before {
  content: attr(data-placeholder);
  color: var(--text-3);
  font-style: normal;
  pointer-events: none;
}
.rich-editor ul, .card-verse ul, .card-analysis ul {
  padding-left: 18px;
  margin: 4px 0;
}
.rich-editor li, .card-verse li, .card-analysis li {
  margin: 3px 0;
  line-height: 1.65;
}

.edit-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-save {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: background .15s;
}
.btn-save:hover { background: #1e3329; }
.btn-cancel {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 20px;
  background: none;
  color: var(--text-3);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s;
}
.btn-cancel:hover { background: var(--bg); color: var(--text); }
.btn-delete {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 20px;
  background: none;
  color: var(--rose);
  border: 1px solid var(--rose-light);
  cursor: pointer;
  margin-left: auto;
  transition: all .15s;
}
.btn-delete:hover { background: var(--rose-light); }

/* keyboard shortcut chip */
.kbd {
  display: inline-block;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text-3);
  font-family: monospace;
}

.hidden { display: none !important; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Modal for tab rename */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  min-width: 320px;
  box-shadow: var(--shadow-lg);
}
.modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.modal input {
  width: 100%;
  font-size: 14px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  outline: none;
  margin-bottom: 14px;
  color: var(--text);
}
.modal input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { order: -1; }
  .card { height: 320px; }
  .card-title { font-size: 18px; }
}

/* ── PASSWORD SCREEN ── */
#pw-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0;
}
.pw-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 44px;
  width: 360px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.pw-logo {
  font-family: 'Lora', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 6px;
  letter-spacing: .02em;
}
.pw-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 32px;
}
.pw-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  align-self: flex-start;
  margin-bottom: 6px;
}
.pw-input {
  width: 100%;
  font-size: 15px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  outline: none;
  margin-bottom: 12px;
  transition: border .15s;
  letter-spacing: .08em;
}
.pw-input:focus { border-color: var(--accent); background: var(--surface); }
.pw-input.error { border-color: #b91c1c; animation: shake .3s; }
@keyframes shake {
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
.pw-btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: background .15s;
  margin-bottom: 10px;
}
.pw-btn:hover { background: #1e3329; }
.pw-err {
  font-size: 12px;
  color: #b91c1c;
  min-height: 18px;
  text-align: center;
}
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pw-screen">
  <div class="pw-box">
    <div class="pw-logo">📖 Khải Huyền</div>
    <div class="pw-sub">Flashcard học thuộc</div>
    <div class="pw-label">Mật khẩu</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="Nhập mật khẩu..." autocomplete="off">
    <button class="pw-btn" onclick="checkPw()">Vào →</button>
    <div class="pw-err" id="pw-err"></div>
  </div>
</div>

<div class="header">
  <div class="logo">Khải Huyền <span>/ Flashcard</span></div>
  <div class="tabs" id="tab-bar"></div>
  <button class="tab-add admin-only" onclick="addTab()" title="Thêm Khải mới">+</button>
  <div style="display:flex;gap:8px;padding:0 8px;flex-shrink:0" class="admin-only">
    <button class="hdr-btn" onclick="exportData()" title="Xuất data để gửi cho người khác">↑ Export</button>
    <button class="hdr-btn" onclick="document.getElementById('import-input').click()" title="Nhận data từ người khác">↓ Import</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="layout">
  <!-- STUDY -->
  <div class="study-area">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
      <span class="progress-label" id="prog-text">0 / 0</span>
      <span class="progress-done" id="prog-done"></span>
    </div>

    <div class="card-wrap" onclick="nextFace()">
      <div class="card" id="card">
        <!-- FACE 1: TITLE -->

<script>
// ── DATA ──────────────────────────────────────────────────────────
let data = {
  tabs: [
    {
      id: 't1',
      name: 'Khải 1',
      cards: [
        { id:'c1', ref:'Khải 1:1', title:'Khải thị của Đức Chúa Jesus Christ', verse:'', analysis:'' },
        { id:'c2', ref:'Khải 1:2', title:'Ngôi lời của Đức Chúa Trời và chứng cớ của Đức Chúa Jesus', verse:'', analysis:'' },
        { id:'c3', ref:'Khải 1:3', title:'Những người giữ Ngôi lời sẽ nhận được phước', verse:'', analysis:'' },
        { id:'c4', ref:'Khải 1:4', title:'Bảy hội thánh ở xứ A-si', verse:'', analysis:'' },
        { id:'c5', ref:'Khải 1:5–6', title:'Nước và thầy tế lễ của Đức Chúa Trời', verse:'', analysis:'' },
        { id:'c6', ref:'Khải 1:7', title:'Chúa Jesus đến giữa những đám mây và những kẻ đã đâm Ngài', verse:'', analysis:'' },
        { id:'c7', ref:'Khải 1:8', title:'An-pha (A) và Ô-mê-ga (Ω)', verse:'', analysis:'' },
        { id:'c8', ref:'Khải 1:9', title:'Sứ đồ Giăng và đảo Bát-mô', verse:'', analysis:'' },
        { id:'c9', ref:'Khải 1:10–11', title:'Giăng được Đức Thánh Linh cảm hóa và nghe có tiếng kêu vang', verse:'', analysis:'' },
        { id:'c10', ref:'Khải 1:12–16', title:'7 chân đèn vàng và Đấng giống như Con Người', verse:'', analysis:'' },
        { id:'c11', ref:'Khải 1:17–18', title:'Giăng mới nhận được sự lựa chọn của Chúa Jesus', verse:'', analysis:'' },
        { id:'c12', ref:'Khải 1:19–20', title:'Nội dung của bức thư và Bí mật của 7 ngôi sao, 7 chân đèn vàng', verse:'', analysis:'' },
      ]
    }
  ]
};
let status = {};
let curTab = 0, curCard = 0, curFace = 1;
let editId = null, editNew = false;
let modalMode = null, modalTabIdx = null;

// Load
try {
  const d = JSON.parse(localStorage.getItem('kh_fc3') || 'null');
  if (d && d.tabs) data = d;
  const s = JSON.parse(localStorage.getItem('kh_fc3_status') || '{}');
  status = s;
} catch(e) {}

function save() {
  try {
    localStorage.setItem('kh_fc3', JSON.stringify(data));
    localStorage.setItem('kh_fc3_status', JSON.stringify(status));
  } catch(e) {}
}

function cards() { return data.tabs[curTab]?.cards || []; }
function card() { return cards()[curCard]; }

// ── TABS ──────────────────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  data.tabs.forEach((t, i) => {
    const doneCount = t.cards.filter(c => status[c.id] === 'g').length;
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === curTab ? ' active' : '');
    btn.innerHTML = `
      ${t.name}
      <span class="tab-count">${t.cards.length}</span>
      <button class="tab-edit-btn admin-only" onclick="event.stopPropagation();openTabEdit(${i})">✎</button>
    `;
    btn.onclick = (e) => {
      if (e.target.classList.contains('tab-edit-btn')) return;
      curTab = i; curCard = 0; curFace = 1;
      cancelEdit();
      renderAll();
    };
    bar.appendChild(btn);
  });
}

function addTab() {
  modalMode = 'add';
  document.getElementById('modal-title').textContent = 'Thêm Khải mới';
  document.getElementById('modal-input').value = `Khải ${data.tabs.length + 1}`;
  document.getElementById('modal-del').classList.add('hidden');
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-input').focus();
  document.getElementById('modal-input').select();
}

function openTabEdit(idx) {
  modalMode = 'edit';
  modalTabIdx = idx;
  document.getElementById('modal-title').textContent = 'Đổi tên tab';
  document.getElementById('modal-input').value = data.tabs[idx].name;
  document.getElementById('modal-del').classList.remove('hidden');
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-input').focus();
  document.getElementById('modal-input').select();
}

function modalConfirm() {
  const name = document.getElementById('modal-input').value.trim();
  if (!name) return;
  if (modalMode === 'add') {
    data.tabs.push({ id: 't' + Date.now(), name, cards: [] });
    curTab = data.tabs.length - 1;
    curCard = 0;
  } else if (modalMode === 'edit') {
    data.tabs[modalTabIdx].name = name;
  }
  save();
  document.getElementById('modal').classList.add('hidden');
  renderAll();
}

function modalDelete() {
  if (data.tabs.length <= 1) { alert('Cần có ít nhất 1 tab'); return; }
  if (!confirm(`Xóa tab "${data.tabs[modalTabIdx].name}" và tất cả thẻ trong đó?`)) return;
  data.tabs.splice(modalTabIdx, 1);
  if (curTab >= data.tabs.length) curTab = data.tabs.length - 1;
  curCard = 0;
  save();
  document.getElementById('modal').classList.add('hidden');
  renderAll();
}

function modalCancel() {
  document.getElementById('modal').classList.add('hidden');
}

// ── CARD LIST ─────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('card-list');
  const cs = cards();
  if (!cs.length) {
    list.innerHTML = '<div style="padding:16px 18px;font-size:13px;color:var(--text-3)">Chưa có thẻ nào</div>';
    return;
  }
  list.innerHTML = '';
  cs.forEach((c, i) => {
    const s = status[c.id] || '';
    const row = document.createElement('div');
    row.className = 'list-item' + (i === curCard ? ' active' : '');
    row.innerHTML = `
      <div class="list-dot ${s}"></div>
      <div class="list-ref">${c.ref}</div>
      <div class="list-title">${c.title}</div>
      <button class="list-btn" onclick="event.stopPropagation();openEdit('${c.id}')">Sửa</button>
    `;
    row.onclick = () => { curCard = i; curFace = 1; cancelEdit(); renderStudy(); renderList(); };
    list.appendChild(row);
  });
}

// ── STUDY ─────────────────────────────────────────────────────────
function renderStudy() {
  const cs = cards();
  const total = cs.length;
  const done = cs.filter(c => status[c.id] === 'g').length;

  document.getElementById('prog-fill').style.width = total ? ((curCard+1)/total*100)+'%' : '0%';
  document.getElementById('prog-text').textContent = total ? `${curCard+1} / ${total}` : '0 / 0';
  document.getElementById('prog-done').textContent = done ? `${done} đã thuộc` : '';

  // face rotation
  const cardEl = document.getElementById('card');
  cardEl.className = 'card' + (curFace === 2 ? ' face2' : curFace === 3 ? ' face3' : '');

  // face indicators
  ['1','2','3'].forEach(n => {
    document.getElementById(`fi1-${n}`).className = 'fi-dot' + (curFace===1&&n==='1'?' f1':curFace===2&&n==='2'?' f1':curFace===3&&n==='3'?' f1':'');
  });
  // simpler: just toggle active class per face
  document.getElementById('fi1-1').className = 'fi-dot' + (curFace===1?' f1':'');
  document.getElementById('fi1-2').className = 'fi-dot' + (curFace===2?' f1':'');
  document.getElementById('fi1-3').className = 'fi-dot' + (curFace===3?' f1':'');
  document.getElementById('fi2-1').className = 'fi-dot' + (curFace===1?' f2':'');
  document.getElementById('fi2-2').className = 'fi-dot' + (curFace===2?' f2':'');
  document.getElementById('fi2-3').className = 'fi-dot' + (curFace===3?' f2':'');
  document.getElementById('fi3-1').className = 'fi-dot' + (curFace===1?' f3':'');
  document.getElementById('fi3-2').className = 'fi-dot' + (curFace===2?' f3':'');
  document.getElementById('fi3-3').className = 'fi-dot' + (curFace===3?' f3':'');

  if (!total) {
    ['f1-ref','f2-ref','f3-ref'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('f1-title').textContent = 'Chưa có thẻ — nhấn "+ Thêm thẻ"';
    document.getElementById('f2-verse').textContent = '';
    document.getElementById('f3-analysis').textContent = '';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    return;
  }

  const c = cs[curCard];
  document.getElementById('f1-ref').textContent = c.ref;
  document.getElementById('f2-ref').textContent = c.ref;
  document.getElementById('f3-ref').textContent = c.ref;
  document.getElementById('f1-title').textContent = c.title;

  const verseEl = document.getElementById('f2-verse');
  if (c.verse && c.verse !== '<br>') {
    verseEl.innerHTML = c.verse;
    verseEl.className = 'card-verse';
    verseEl.onclick = null;
  } else {
    verseEl.innerHTML = isAdmin ? '↓ Chưa có trích đoạn — click Sửa để điền' : '(Chưa có trích đoạn)';
    verseEl.className = 'card-verse empty';
    if (isAdmin) verseEl.onclick = (e) => { e.stopPropagation(); openEdit(c.id); };
    else verseEl.onclick = null;

  const anaEl = document.getElementById('f3-analysis');

    anaEl.innerHTML = c.analysis;
    anaEl.className = 'card-analysis';

    anaEl.innerHTML = isAdmin ? '↓ Chưa có giải nghĩa — click Sửa để điền' : '(Chưa có giải nghĩa)';
    anaEl.className = 'card-analysis empty';
    if (isAdmin) anaEl.onclick = (e) => { e.stopPropagation(); openEdit(c.id); };
    else anaEl.onclick = null;

function nextFace() {
  if (!cards().length) return;
  curFace = curFace === 3 ? 1 : curFace + 1;
  renderStudy();
}

function nextCard() {
  if (curCard < cards().length - 1) { curCard++; curFace = 1; renderStudy(); renderList(); }
}
function prevCard() {
  if (curCard > 0) { curCard--; curFace = 1; renderStudy(); renderList(); }
}

function mark(type) {
  const c = card(); if (!c) return;
  status[c.id] = status[c.id] === type ? '' : type;
  save(); renderStudy(); renderList();
  if (type === 'g' && curCard < cards().length - 1) setTimeout(nextCard, 360);
}

// ── FORMAT ────────────────────────────────────────────────────────
let savedRanges = {};

function fmt(editorId, cmd) {
  const el = document.getElementById(editorId);
  el.focus();
  if (cmd === 'clear') {
    document.execCommand('removeFormat', false, null);
    return;
  }
  if (cmd === 'ul') {
    document.execCommand('insertUnorderedList', false, null);
    return;
  }
  if (cmd.startsWith('color:')) {
    const color = cmd.slice(6);
    if (color === 'none') document.execCommand('foreColor', false, 'inherit');
    else document.execCommand('foreColor', false, color);
    return;
  }
  const cmdMap = { b: 'bold', i: 'italic', u: 'underline' };
  document.execCommand(cmdMap[cmd], false, null);
}

// Auto-bullet: type "- " at start of line → convert to list item
// Auto-arrow: type "->" → replace with "→"
document.addEventListener('keydown', e => {
  const active = document.activeElement;
  if (!active || !active.classList.contains('rich-editor')) return;

  // Ctrl/Cmd shortcuts
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'b') { e.preventDefault(); fmt(active.id, 'b'); }
    if (e.key === 'i') { e.preventDefault(); fmt(active.id, 'i'); }
    if (e.key === 'u') { e.preventDefault(); fmt(active.id, 'u'); }
    return;
  }

  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const node = range.startContainer;

  // Auto-arrow: "->" → "→"
  if (e.key === '>') {
    if (node.nodeType === Node.TEXT_NODE) {
      const textBefore = node.textContent.slice(0, range.startOffset);
      if (textBefore.endsWith('-')) {
        e.preventDefault();
        // Delete the "-" and insert "→"
        const newRange = sel.getRangeAt(0).cloneRange();
        newRange.setStart(node, range.startOffset - 1);
        newRange.setEnd(node, range.startOffset);
        newRange.deleteContents();
        document.execCommand('insertText', false, '→');
        return;
      }
    }
  }

  // Auto-bullet on Space after "-" at start of block
  if (e.key === ' ') {
    if (node.nodeType !== Node.TEXT_NODE) return;
    const textBefore = node.textContent.slice(0, range.startOffset);
    const lineStart = textBefore.lastIndexOf('\n') + 1;
    const lineText = textBefore.slice(lineStart);
    if (lineText === '-') {
      e.preventDefault();
      range.setStart(node, range.startOffset - 1);
      range.deleteContents();
      document.execCommand('insertUnorderedList', false, null);
    }
  }
}, true);

  const title = document.getElementById('e-title').value.trim();
  const verse = document.getElementById('e-verse').innerHTML.trim();
  const analysis = document.getElementById('e-analysis').innerHTML.trim();
  if (!ref || !title) { alert('Cần nhập Tham chiếu và Tiêu đề'); return; }

  if (editNew) {
    const id = 'c' + Date.now();
    data.tabs[curTab].cards.push({ id, ref, title, verse, analysis });
    curCard = data.tabs[curTab].cards.length - 1;
  } else {
    const c = cards().find(x => x.id === editId);
    if (c) { c.ref = ref; c.title = title; c.verse = verse; c.analysis = analysis; }
  }
  save(); cancelEdit(); curFace = 1; renderAll();
}

function deleteCard() {
  if (!editId || !confirm('Xóa thẻ này?')) return;
  data.tabs[curTab].cards = data.tabs[curTab].cards.filter(c => c.id !== editId);
  if (curCard >= data.tabs[curTab].cards.length) curCard = Math.max(0, data.tabs[curTab].cards.length - 1);
  save(); cancelEdit(); renderAll();
}

function cancelEdit() {
  editId = null; editNew = false;
  document.getElementById('edit-panel').classList.add('hidden');
}

// ── KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  const isEditing = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.contentEditable === 'true';
  if (isEditing) {
    if (e.key === 'Escape') { cancelEdit(); document.getElementById('modal').classList.add('hidden'); }
    return;
  }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === ' ') { e.preventDefault(); nextFace(); }
  if (e.key === '1') mark('g');
  if (e.key === '2') mark('r');
  if (e.key === '3') mark('h');
  if (e.key === 'Escape') { cancelEdit(); document.getElementById('modal').classList.add('hidden'); }
});

document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') modalConfirm();
  if (e.key === 'Escape') modalCancel();
});

// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportData() {
  const payload = { data, status, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10);
  a.download = `khai_huyen_${date}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.data || !payload.data.tabs) { alert('File không hợp lệ'); return; }
      if (!confirm(`Import sẽ ghi đè toàn bộ nội dung hiện tại. Tiếp tục?`)) return;
      data = payload.data;
      status = payload.status || {};
      curTab = 0; curCard = 0; curFace = 1;
      save();
      cancelEdit();
      renderAll();
      alert('Import thành công!');
    } catch(err) {
      alert('Lỗi đọc file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── RENDER ALL ────────────────────────────────────────────────────
function renderAll() {
  renderTabs();
  renderStudy();
  renderList();
  applyMode();
}

// ── MODE: view vs admin ───────────────────────────────────────────
let isAdmin = false;

function applyMode() {
  // Elements only visible to admin
  const adminEls = document.querySelectorAll('.admin-only');
  adminEls.forEach(el => {
    el.style.display = isAdmin ? '' : 'none';
  });
  // List edit buttons
  document.querySelectorAll('.list-btn').forEach(btn => {
    btn.style.display = isAdmin ? '' : 'none';
  });
  // Panel header add button
  const addBtn = document.querySelector('.panel-header button');
  if (addBtn) addBtn.style.display = isAdmin ? '' : 'none';
}

// ── PASSWORD ──────────────────────────────────────────────────────
function checkPw() {
  const input = document.getElementById('pw-input').value;
  const inputEl = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-err');

  if (input === 'donganadmin') {
    isAdmin = true;
    try { sessionStorage.setItem('kh_auth', 'admin'); } catch(e) {}
    document.getElementById('pw-screen').style.display = 'none';
    renderAll();
  } else if (input === 'dongan') {
    isAdmin = false;
    try { sessionStorage.setItem('kh_auth', 'view'); } catch(e) {}
    document.getElementById('pw-screen').style.display = 'none';
    renderAll();
  } else {
    errEl.textContent = 'Mật khẩu không đúng, thử lại';
    inputEl.classList.add('error');
    inputEl.value = '';
    inputEl.focus();
    setTimeout(() => inputEl.classList.remove('error'), 400);
  }
}

// Enter key on password input
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPw();
  document.getElementById('pw-err').textContent = '';
});

// Boot — check session
const savedAuth = sessionStorage.getItem('kh_auth');
if (savedAuth === 'admin') {
  isAdmin = true;
  document.getElementById('pw-screen').style.display = 'none';
  renderAll();
} else if (savedAuth === 'view') {
  isAdmin = false;
  document.getElementById('pw-screen').style.display = 'none';
  renderAll();
} else {
  document.getElementById('pw-input').focus();
}
</script>
</body>
